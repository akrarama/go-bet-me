<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Ставишь на себя, ИИ проверяет по камере, друзья ставят против. Управление только жестами.">
  <title>Против</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0c'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23d4ff3a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/exercises.css">
  <link rel="stylesheet" href="styles/gestures.css">
  <link rel="stylesheet" href="styles/money.css">
  <link rel="stylesheet" href="styles/meditation.css">
  <link rel="stylesheet" href="styles/friend.css">
  <link rel="stylesheet" href="styles/readability.css">
</head>
<body>
  <div id="stage" class="stage">
    <section id="account-gate" class="account-gate" hidden aria-label="Аккаунт"></section>
    <video id="video" class="stage__video" playsinline muted></video>
    <div class="stage__scrim"></div>
    <canvas id="overlay" class="stage__overlay"></canvas>

    <header class="topbar">
      <div class="brand">Против<span class="brand__dot"></span></div>
      <div class="topbar__right">
        <div class="chip chip--ghost sound-hint">🔈 Коснись экрана, чтобы включить звук</div>
        <div id="balance" class="chip"></div>
      </div>
    </header>

    <main id="screen" class="screen"></main>
    <aside id="feed" class="feed" aria-live="polite"></aside>
    <div id="hint" class="hint" role="status" hidden></div>
    <div id="toasts" class="toasts"></div>
    <div id="cursor" class="cursor" hidden></div>

    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div id="loader-text" class="loader__text">Загрузка</div>
    </div>
    <pre id="debug" class="debug" hidden></pre>
  </div>
  <noscript>Нужен браузер с включённым JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
